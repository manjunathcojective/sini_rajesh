[build]
  command = "npm run build"
  publish = "out"
  functions = "netlify/functions"

[build.environment]
  NETLIFY_NEXT_PLUGIN_SKIP = "true"

# Contact form API Netlify serverless function
[[redirects]]
  from = "/api/contact"
  to = "/.netlify/functions/contact"
  status = 200

# Services root redirection to primary service
[[redirects]]
  from = "/services"
  to = "/services/organisational-diagnostic-study"
  status = 301

[[redirects]]
  from = "/services/"
  to = "/services/organisational-diagnostic-study"
  status = 301

# Clean static URL rewrites (status = 200, ZERO 301 redirects for client-side router)
[[redirects]]
  from = "/about"
  to = "/about.html"
  status = 200

[[redirects]]
  from = "/contact"
  to = "/contact.html"
  status = 200

[[redirects]]
  from = "/blogs"
  to = "/blogs.html"
  status = 200

[[redirects]]
  from = "/services/coaching"
  to = "/services/coaching.html"
  status = 200

[[redirects]]
  from = "/services/happiness-coaching"
  to = "/services/happiness-coaching.html"
  status = 200

[[redirects]]
  from = "/services/hr-consultancy"
  to = "/services/hr-consultancy.html"
  status = 200

[[redirects]]
  from = "/services/mentoring"
  to = "/services/mentoring.html"
  status = 200

[[redirects]]
  from = "/services/organisational-diagnostic-study"
  to = "/services/organisational-diagnostic-study.html"
  status = 200
